# ==============================================================================
# Bonita Platform Cluster Configuration - Docker Compose
# ==============================================================================
# This file configures Hazelcast clustering for Bonita Enterprise/Performance Edition
# It is automatically loaded when mounted at /opt/custom-config.d/
#
# For Docker Compose, we use TCP/IP discovery with static member list
# instead of Kubernetes service discovery.
# ==============================================================================

# ------------------------------------------------------------------------------
# CLUSTER IDENTITY
# ------------------------------------------------------------------------------
# Unique name for this cluster (all members must use the same name)
bonita.cluster.group.name=bonita-docker-cluster

# ------------------------------------------------------------------------------
# DISCOVERY METHOD CONFIGURATION
# ------------------------------------------------------------------------------
# Disable all discovery methods except TCP/IP
bonita.platform.cluster.hazelcast.multicast.enabled=false
bonita.platform.cluster.hazelcast.tcpip.enabled=true
bonita.platform.cluster.hazelcast.aws.enabled=false
bonita.platform.cluster.hazelcast.kubernetes.enabled=false

# ------------------------------------------------------------------------------
# TCP/IP DISCOVERY - STATIC MEMBER LIST
# ------------------------------------------------------------------------------
# List of cluster members using Docker Compose service names
# Format: hostname:port,hostname:port,...
# Port 5701 is the default Hazelcast port
bonita.platform.cluster.hazelcast.tcpip.members=bonita-runtime-1:5701,bonita-runtime-2:5701

# ------------------------------------------------------------------------------
# PARTITION GROUP CONFIGURATION
# ------------------------------------------------------------------------------
# Enable partition groups for better data distribution
bonita.platform.cluster.hazelcast.partitionGroup.enabled=true

# Group type: CUSTOM for Docker Compose (ZONE_AWARE is for cloud with availability zones)
bonita.platform.cluster.hazelcast.partitionGroup.groupType=CUSTOM

# ------------------------------------------------------------------------------
# DIAGNOSTICS AND MONITORING
# ------------------------------------------------------------------------------
# Disable verbose diagnostics for production (enable for troubleshooting)
bonita.platform.cluster.hazelcast.diagnostics.enabled=false

# Diagnostic metric level (debug, info, warn)
bonita.platform.cluster.hazelcast.diagnostics.metric.level=info

# ------------------------------------------------------------------------------
# CLUSTER MONITORING
# ------------------------------------------------------------------------------
# Enable monitoring of distributed locks in the cluster
org.bonitasoft.engine.monitoring.metrics.cluster.locks.enable=true

# ------------------------------------------------------------------------------
# ADDITIONAL HAZELCAST SETTINGS (Optional)
# ------------------------------------------------------------------------------
# Uncomment and adjust these settings for performance tuning if needed:

# Connection timeout when connecting to members (milliseconds)
# bonita.platform.cluster.hazelcast.connection.timeout=30000

# Max number of no-heartbeat seconds to accept before member is removed from cluster
# bonita.platform.cluster.hazelcast.max.no.heartbeat.seconds=300

# Heartbeat interval in seconds
# bonita.platform.cluster.hazelcast.heartbeat.interval.seconds=5

# ------------------------------------------------------------------------------
# MULTICAST AND IPV6 DISABLE (for Rosetta 2 / Apple Silicon compatibility)
# ------------------------------------------------------------------------------
# Explicitly disable multicast and IPv6 to prevent socket errors in emulation
bonita.platform.cluster.hazelcast.ipv6.enabled=false
bonita.platform.cluster.hazelcast.interfaces.enabled=false
bonita.platform.cluster.hazelcast.interfaces.required=false

# ==============================================================================
# IMPORTANT NOTES
# ==============================================================================
# 1. All cluster members must have the same bonita.cluster.group.name
# 2. Each member's hostname in tcpip.members must resolve within Docker network
# 3. Port 5701 must be accessible between cluster members
# 4. hazelcast.local.publicAddress is set via Java system property in docker-compose
# 5. This file is automatically processed when mounted at /opt/custom-config.d/
# ==============================================================================
